[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "api.app.engine.*"
disallow_untyped_defs = true
disallow_any_unimported = true
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]
